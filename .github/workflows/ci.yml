name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cleartusk
          POSTGRES_PASSWORD: cleartusk
          POSTGRES_DB: cleartusk
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system audio libraries
        run: sudo apt-get update && sudo apt-get install -y libsndfile1 ffmpeg

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[postgres,server,dev]"

      - name: Lint
        run: ruff check .

      - name: Test (SQLite fallback)
        run: pytest --cov=cleartusk --cov-report=term-missing

      - name: Test (PostgreSQL)
        env:
          CLEARTUSK_TEST_DATABASE_URL: postgresql+psycopg://cleartusk:cleartusk@localhost:5432/cleartusk_test
        run: |
          PGPASSWORD=cleartusk createdb -h localhost -U cleartusk cleartusk_test
          pytest

      - name: Verify migrations against PostgreSQL
        env:
          CLEARTUSK_DATABASE_URL: postgresql+psycopg://cleartusk:cleartusk@localhost:5432/cleartusk
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          cleartusk config
