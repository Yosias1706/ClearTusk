[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cleartusk"
version = "1.0.0"
description = "Isolate elephant vocalisations from machine noise in field recordings, with detection and analytics."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yosias Redi" }]
keywords = ["bioacoustics", "audio", "denoising", "elephant", "conservation", "flask"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: Flask",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
  "flask>=3.0",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic-settings>=2.2",
  "librosa>=0.10",
  "soundfile>=0.12",
  "scipy>=1.11",
  "numpy>=1.26",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "pydub>=0.25",
  "click>=8.1",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
server = ["gunicorn>=21.2"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[project.scripts]
cleartusk = "cleartusk.cli:main"

[project.urls]
Homepage = "https://github.com/yosiasredi/cleartusk"

[tool.setuptools.packages.find]
include = ["cleartusk*"]

[tool.setuptools.package-data]
cleartusk = ["web/templates/**/*.html", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.coverage.run]
source = ["cleartusk"]
omit = ["cleartusk/web/static/*"]
